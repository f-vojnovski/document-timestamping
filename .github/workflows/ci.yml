name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api:
    name: API tests (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-timestamping-api
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test

  client:
    name: Client build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-timestamping-client-app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: document-timestamping-client-app/package-lock.json
      - name: Install and build
        run: |
          npm ci
          npm run build
