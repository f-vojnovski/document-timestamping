# Database. Credentials come from the environment; DB_PASSWORD has no default so
# the application fails at startup rather than falling back to a known password.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/documenttimestamping}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Browser origins allowed to call the API. Defaults to the local React dev server;
# set APP_CORS_ALLOWED_ORIGINS to a comma-separated list for other deployments.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Signing key. Locations take any Spring resource prefix, so classpath: works for
# local development and file: points at a keystore mounted outside the jar.
# See the README for the keytool commands that generate these.
timestamping.keystore.location=${KEYSTORE_LOCATION:classpath:cipher/sender_keystore.p12}
timestamping.keystore.password=${KEYSTORE_PASSWORD}
timestamping.keystore.type=${KEYSTORE_TYPE:PKCS12}
timestamping.keystore.key-alias=${KEYSTORE_KEY_ALIAS:senderKeyPair}

# Public certificate handed to clients for verification.
timestamping.truststore.location=${TRUSTSTORE_LOCATION:classpath:cipher/receiver_keystore.p12}
timestamping.truststore.password=${TRUSTSTORE_PASSWORD:${KEYSTORE_PASSWORD}}
timestamping.truststore.type=${TRUSTSTORE_TYPE:PKCS12}
timestamping.truststore.certificate-alias=${TRUSTSTORE_CERTIFICATE_ALIAS:receiverKeyPair}
