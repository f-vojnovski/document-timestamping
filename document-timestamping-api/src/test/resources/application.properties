# Test configuration. Overrides the main properties file so the suite runs with no
# PostgreSQL instance and no environment variables set.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# The keystore is opened lazily on the first signing request, so the context starts
# without one present. Tests that exercise signing supply their own keys in memory.
timestamping.keystore.location=classpath:cipher/sender_keystore.p12
timestamping.keystore.password=testonly
timestamping.keystore.key-alias=senderKeyPair
timestamping.truststore.location=classpath:cipher/receiver_keystore.p12
timestamping.truststore.password=testonly
timestamping.truststore.certificate-alias=receiverKeyPair
